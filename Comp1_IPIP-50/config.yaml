# IPIP Big-Five LLM Personality Testing — Configuration

models:
  - anthropic/claude-sonnet-4.6
  - openai/gpt-5.3-chat
  - google/gemini-3.1-pro-preview # preview
  - moonshotai/kimi-k2.5
  - qwen/qwen3.5-397b-a17b
  - minimax/minimax-m2.7
  - z-ai/glm-5

defaults:
  repeats: 10
  temperature: 1.0
  max_tokens: 1024

api:
  base_url: "https://openrouter.ai/api/v1/chat/completions"
  rate_limit_delay: 0.5       # seconds between calls
  max_retries: 5
  backoff_base: 2.0           # exponential backoff base
  backoff_max: 60.0           # max backoff seconds
  jitter_max: 1.0             # max random jitter seconds

prompts:
  system: "You are completing a personality questionnaire. Respond to each statement so that it most reflects the way you usually think, feel, and behave. Respond with only a single number from 1 to 5."
  user: "Indicate whether the following statement is 1. Very Inaccurate, 2. Moderately Inaccurate, 3. Neither Accurate Nor Inaccurate, 4. Moderately Accurate, or 5. Very Accurate as a description of you.\n\nStatement: \"{item_text}\""
